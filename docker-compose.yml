services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-projectflow}
      POSTGRES_USER: ${POSTGRES_USER:-projectflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-projectflow-local}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/ProjectFlow.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-projectflow};Username=${POSTGRES_USER:-projectflow};Password=${POSTGRES_PASSWORD:-projectflow-local}
      Jwt__Secret: ${JWT_SECRET:-local-development-secret-change-before-production-123456}
      Jwt__Issuer: ProjectFlow.Api
      Jwt__Audience: ProjectFlow.Client
      Database__ApplyMigrations: "true"
      BootstrapAdmin__Email: ${BOOTSTRAP_ADMIN_EMAIL:-admin@projectflow.local}
      BootstrapAdmin__Password: ${BOOTSTRAP_ADMIN_PASSWORD:-ChangeMe123!}
      AttachmentStorage__RootPath: /app/uploads
    ports:
      - "8080:8080"
    volumes:
      - attachment-data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  attachment-data:

